name: Release

on:
  push:
    tags:
      - 'version-*'

# Only one release at a time
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    environment: release

    env:
      PROJECT_PATH: ShiftIt/ShiftIt.xcodeproj
      SCHEME: ShiftIt
      INFO_PLIST: ShiftIt/ShiftIt-Info.plist
      ARCHIVE_DIR: build

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract version from tag
        id: version
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          VERSION="${TAG_NAME#version-}"

          # Betas use a "bN" suffix (e.g. 2.2.0b1), not "-beta": Sparkle
          # treats 2.2.0-beta as equal to 2.2.0 but orders 2.2.0b1 < 2.2.0
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(b[0-9]+)?$ ]]; then
            echo "::error::Invalid version format: $VERSION (expected X.Y.Z or X.Y.ZbN)"
            exit 1
          fi

          if [[ "$VERSION" == *b* ]]; then
            BETA=true
          else
            BETA=false
          fi

          {
            echo "version=$VERSION"
            echo "tag=$TAG_NAME"
            echo "archive_name=ShiftIt-${VERSION}.zip"
            echo "beta=$BETA"
          } >> "$GITHUB_OUTPUT"

      # Sign and notarise when the signing secrets are configured, otherwise
      # build an ad-hoc signed pre-release that is never added to the appcast
      - name: Detect signing mode
        id: mode
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          SPARKLE_KEY: ${{ secrets.SPARKLE_ED_KEY }}
          BETA: ${{ steps.version.outputs.beta }}
        run: |
          SECRETS=(CERTIFICATE_P12 CERTIFICATE_PASSWORD APPLE_TEAM_ID NOTARY_APPLE_ID NOTARY_PASSWORD SPARKLE_KEY)
          MISSING=()
          for name in "${SECRETS[@]}"; do
            if [ -z "${!name}" ]; then
              MISSING+=("$name")
            fi
          done

          if [ ${#MISSING[@]} -eq 0 ]; then
            SIGNED=true
          elif [ ${#MISSING[@]} -eq ${#SECRETS[@]} ]; then
            SIGNED=false
            echo "::warning::No signing secrets configured: building an unsigned pre-release"
          else
            # Fail rather than silently ship an unsigned build when a secret is missing
            echo "::error::Some signing secrets are missing: ${MISSING[*]}"
            exit 1
          fi

          if [ "$SIGNED" = true ] && [ "$BETA" = false ]; then
            PRERELEASE=false
          else
            PRERELEASE=true
          fi

          echo "signed=$SIGNED" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Signed: $SIGNED, pre-release: $PRERELEASE"

      - name: Stamp version into Info.plist
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          plutil -replace CFBundleShortVersionString -string "$VERSION" "$INFO_PLIST"
          plutil -replace CFBundleVersion -string "$VERSION" "$INFO_PLIST"
          echo "Stamped version $VERSION into $INFO_PLIST"

      - name: Cache SPM packages
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Resolve dependencies
        run: |
          xcodebuild -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -resolvePackageDependencies

      # --- Signing Setup ---

      - name: Import signing certificate
        if: steps.mode.outputs.signed == 'true'
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"

          # Allow codesign to access the keychain
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          # Add to search list
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          # Export for later steps
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      # --- Build ---

      - name: Build for release
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SIGNED: ${{ steps.mode.outputs.signed }}
        run: |
          if [ "$SIGNED" = true ]; then
            SIGNING_SETTINGS=(
              CODE_SIGN_IDENTITY="Developer ID Application"
              DEVELOPMENT_TEAM="$APPLE_TEAM_ID"
              OTHER_CODE_SIGN_FLAGS="--timestamp --keychain $KEYCHAIN_PATH"
              ENABLE_HARDENED_RUNTIME=YES
            )
          else
            # Ad-hoc signature, as in CI. No hardened runtime, because its library
            # validation needs a Team ID that ad-hoc signed frameworks don't have
            SIGNING_SETTINGS=(
              CODE_SIGN_IDENTITY="-"
              ENABLE_HARDENED_RUNTIME=NO
            )
          fi

          xcodebuild -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Release \
            -derivedDataPath "$ARCHIVE_DIR" \
            "${SIGNING_SETTINGS[@]}" \
            build | xcpretty || exit 1

      - name: Re-sign app and embedded frameworks
        env:
          SIGNED: ${{ steps.mode.outputs.signed }}
        run: |
          APP_PATH="$ARCHIVE_DIR/Build/Products/Release/ShiftIt.app"

          if [ "$SIGNED" = true ]; then
            SIGN_ARGS=(--sign "Developer ID Application" --timestamp --options runtime --keychain "$KEYCHAIN_PATH")
          else
            SIGN_ARGS=(--sign -)
          fi

          # Re-sign all nested code (Sparkle XPC services, helpers, framework)
          find "$APP_PATH/Contents/Frameworks" -type f -perm +111 -o -name "*.dylib" | while read -r binary; do
            codesign --force "${SIGN_ARGS[@]}" "$binary" || true
          done

          # Re-sign XPC services
          find "$APP_PATH" -name "*.xpc" -type d | while read -r xpc; do
            codesign --force --deep "${SIGN_ARGS[@]}" "$xpc"
          done

          # Re-sign nested .app bundles (e.g., Sparkle Updater.app)
          find "$APP_PATH" -name "*.app" -not -path "$APP_PATH" -type d | while read -r nested_app; do
            codesign --force --deep "${SIGN_ARGS[@]}" "$nested_app"
          done

          # Re-sign the Sparkle framework itself
          find "$APP_PATH" -name "*.framework" -type d | while read -r fw; do
            codesign --force "${SIGN_ARGS[@]}" "$fw"
          done

          # Finally re-sign the main app
          codesign --force "${SIGN_ARGS[@]}" "$APP_PATH"

      - name: Verify code signature
        run: |
          APP_PATH="$ARCHIVE_DIR/Build/Products/Release/ShiftIt.app"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          echo "Code signature verified"
          spctl --assess --type exec --verbose=2 "$APP_PATH" || echo "spctl assessment (may require notarization)"

      # --- Package ---

      - name: Create archive
        env:
          ARCHIVE_NAME: ${{ steps.version.outputs.archive_name }}
        run: |
          APP_PATH="$ARCHIVE_DIR/Build/Products/Release/ShiftIt.app"
          ARCHIVE_PATH="$ARCHIVE_DIR/$ARCHIVE_NAME"
          ditto -ck --keepParent "$APP_PATH" "$ARCHIVE_PATH"
          echo "archive_path=$ARCHIVE_PATH" >> "$GITHUB_ENV"

      # --- Notarize ---

      - name: Notarize app
        id: notarize
        if: steps.mode.outputs.signed == 'true'
        env:
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ARCHIVE_NAME: ${{ steps.version.outputs.archive_name }}
        run: |
          ARCHIVE_PATH="$ARCHIVE_DIR/$ARCHIVE_NAME"

          # Submit and capture the submission ID
          SUBMIT_OUTPUT=$(xcrun notarytool submit "$ARCHIVE_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$NOTARY_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 30m 2>&1) || true

          echo "$SUBMIT_OUTPUT"

          # Extract submission ID for log fetching
          SUBMISSION_ID=$(echo "$SUBMIT_OUTPUT" | grep -m1 'id:' | awk '{print $2}')
          echo "submission_id=$SUBMISSION_ID" >> "$GITHUB_OUTPUT"

          # Check if notarization succeeded
          if echo "$SUBMIT_OUTPUT" | grep -q "status: Accepted"; then
            echo "Notarization accepted"
          else
            echo "::error::Notarization failed. Fetching log..."
            xcrun notarytool log "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" \
              --password "$NOTARY_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" || true
            exit 1
          fi

          # Staple the ticket to the app, then re-archive
          APP_PATH="$ARCHIVE_DIR/Build/Products/Release/ShiftIt.app"
          xcrun stapler staple "$APP_PATH"
          rm -f "$ARCHIVE_PATH"
          ditto -ck --keepParent "$APP_PATH" "$ARCHIVE_PATH"

      # --- Sparkle Signing ---

      - name: Sign with Sparkle EdDSA
        id: sparkle
        if: steps.mode.outputs.signed == 'true'
        env:
          SPARKLE_KEY: ${{ secrets.SPARKLE_ED_KEY }}
          ARCHIVE_NAME: ${{ steps.version.outputs.archive_name }}
        run: |
          ARCHIVE_PATH="$ARCHIVE_DIR/$ARCHIVE_NAME"

          # Pass key via stdin (-f -) for compatibility with all sign_update versions
          SIGN_OUTPUT=$(echo "$SPARKLE_KEY" | ShiftIt/bin/sign_update "$ARCHIVE_PATH" -f -)
          echo "sign_update output: $SIGN_OUTPUT"

          ED_SIGNATURE=$(echo "$SIGN_OUTPUT" | grep -o 'sparkle:edSignature="[^"]*"' | cut -d'"' -f2)
          FILE_LENGTH=$(echo "$SIGN_OUTPUT" | grep -o 'length="[^"]*"' | cut -d'"' -f2)

          # Fallback: some versions output just the signature string
          if [ -z "$ED_SIGNATURE" ]; then
            ED_SIGNATURE=$(echo "$SIGN_OUTPUT" | head -1)
            FILE_LENGTH=$(stat -f%z "$ARCHIVE_PATH")
          fi

          if [ -z "$ED_SIGNATURE" ]; then
            echo "::error::Failed to get EdDSA signature"
            exit 1
          fi

          echo "signature=$ED_SIGNATURE" >> "$GITHUB_OUTPUT"
          echo "length=$FILE_LENGTH" >> "$GITHUB_OUTPUT"

      # --- Update Appcast ---

      # Only signed, non-beta releases go to the appcast that Sparkle offers to every user
      - name: Generate appcast.xml
        if: steps.mode.outputs.prerelease == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCHIVE_NAME: ${{ steps.version.outputs.archive_name }}
          ED_SIGNATURE: ${{ steps.sparkle.outputs.signature }}
          FILE_LENGTH: ${{ steps.sparkle.outputs.length }}
        run: |
          PUB_DATE=$(date -u "+%a, %d %b %Y %H:%M:%S +0000")
          GITHUB_REPO="citadelgrad/ShiftIt"

          cat > release/appcast.xml << APPCAST_EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" xmlns:dc="http://purl.org/dc/elements/1.1/">
             <channel>
                <title>ShiftIt Changelog</title>
                <link>https://raw.githubusercontent.com/${GITHUB_REPO}/main/release/appcast.xml</link>
                <language>en</language>
                <item>
                   <title>ShiftIt version ${VERSION}</title>
                   <sparkle:releaseNotesLink>
                      https://raw.githubusercontent.com/${GITHUB_REPO}/main/release/release-notes-${VERSION}.html
                   </sparkle:releaseNotesLink>
                   <pubDate>${PUB_DATE}</pubDate>
                   <enclosure
                      url="https://github.com/${GITHUB_REPO}/releases/download/version-${VERSION}/${ARCHIVE_NAME}"
                      sparkle:version="${VERSION}"
                      length="${FILE_LENGTH}"
                      type="application/octet-stream"
                      sparkle:edSignature="${ED_SIGNATURE}" />
                   <sparkle:minimumSystemVersion>14.6</sparkle:minimumSystemVersion>
                </item>
             </channel>
          </rss>
          APPCAST_EOF

      - name: Commit appcast update
        if: steps.mode.outputs.prerelease == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          git add release/appcast.xml
          git commit -m "Update appcast.xml for version $VERSION"
          git push origin main

      # --- GitHub Release ---

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          ARCHIVE_NAME: ${{ steps.version.outputs.archive_name }}
          SIGNED: ${{ steps.mode.outputs.signed }}
          PRERELEASE: ${{ steps.mode.outputs.prerelease }}
        run: |
          ARCHIVE_PATH="$ARCHIVE_DIR/$ARCHIVE_NAME"

          RELEASE_ARGS=(--title "ShiftIt $VERSION" --generate-notes)
          if [ "$PRERELEASE" = true ]; then
            RELEASE_ARGS+=(--prerelease)
          fi
          if [ "$SIGNED" = false ]; then
            RELEASE_ARGS+=(--notes "This build is not signed with a Developer ID or notarised, so macOS blocks it the first time it is opened. To allow it, try to open ShiftIt, then go to System Settings > Privacy & Security and click Open Anyway, or run \`xattr -dr com.apple.quarantine /Applications/ShiftIt.app\`. It is not offered through automatic updates.")
          fi

          gh release create "$TAG" "$ARCHIVE_PATH" "${RELEASE_ARGS[@]}"

      # --- Cleanup ---

      - name: Cleanup keychain
        if: always()
        run: |
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
